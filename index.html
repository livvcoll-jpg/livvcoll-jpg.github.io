<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Invaders</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09070d;color:#f7dce8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:18px}
main{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(24px,5vw,42px);margin:0;color:#ff83b5;letter-spacing:2px;text-shadow:3px 3px #64234b}p{margin:6px 0 0;color:#c5aaba;font-size:12px}.hud{display:flex;gap:20px;font-size:14px}.hud b{color:#fff}#frame{border:2px solid #63334f;background:#05050a;box-shadow:0 0 0 5px #1c1220,0 0 32px #7a285344;position:relative}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;color:#c5aaba;font-size:12px}.btns{display:flex;gap:8px}button{background:#281522;border:1px solid #a64e79;color:#ffe6f0;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#51223e}.mobile{display:none;gap:8px;margin-top:12px}.mobile button{flex:1;font-size:18px}@media(max-width:600px){.mobile{display:flex}.hud{gap:10px;font-size:12px}}
</style>
</head>
<body><main>
<header><div><h1>CAT INVADERS</h1><p>THEY HAVE COME FOR THE TUNA.</p></div><div class="hud"><span>SCORE <b id="score">0000</b></span><span>LIVES <b id="lives">♥ ♥ ♥</b></span></div></header>
<div id="frame"><canvas id="game" width="800" height="560" aria-label="Cat Invaders game"></canvas></div>
<div class="mobile"><button id="left">◀</button><button id="fire">PAW! / FIRE</button><button id="right">▶</button></div>
<div class="bottom"><span>MOVE: ← → / A D &nbsp; • &nbsp; SHOOT: SPACE &nbsp; • &nbsp; PAUSE: P</span><div class="btns"><button id="restart">RESTART</button></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const paths=['assets/cat_invader_1.png','assets/cat_invader_2.png','assets/cat_invader_3.png'];
const rats=['assets/rat_player_1.png','assets/rat_player_2.png','assets/rat_player_3.png'];
const catImgs=paths.map(src=>{const i=new Image();i.src=src;return i});
const ratImgs=rats.map(src=>{const i=new Image();i.src=src;return i});
let keys={},player,invaders,shots,enemyShots,score,lives,dir,frame,gameOver,paused,won;
const W=canvas.width,H=canvas.height;
function reset(){player={x:W/2,y:H-65,w:48,h:56,speed:5,cool:0};invaders=[];shots=[];enemyShots=[];score=0;lives=3;dir=1;frame=0;gameOver=false;paused=false;won=false;
for(let r=0;r<4;r++)for(let c=0;c<8;c++)invaders.push({x:85+c*84,y:55+r*68,w:44,h:43,type:(r+c)%3,alive:true});
updateHud()}
function updateHud(){document.getElementById('score').textContent=String(score).padStart(4,'0');document.getElementById('lives').textContent=lives?'♥ '.repeat(lives).trim():'—'}
function drawSprite(img,x,y,w,h){if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,Math.round(x),Math.round(y),w,h)}
function text(s,y,size=22,color='#ffd9e8'){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(s,W/2,y)}
function shoot(){if(player.cool<=0&&!gameOver&&!paused){shots.push({x:player.x,y:player.y-25});player.cool=14}}
function tick(){requestAnimationFrame(tick);frame++;ctx.clearRect(0,0,W,H);ctx.fillStyle='#07060c';ctx.fillRect(0,0,W,H);
for(let i=0;i<70;i++){let x=(i*137+31)%W,y=(i*71+Math.floor(frame/4)*(i%3+1))%H;ctx.fillStyle=i%4===0?'#70405d':'#34233b';ctx.fillRect(x,y,2,2)}
if(!gameOver&&!paused){if(keys.ArrowLeft||keys.a||keys.A||touchLeft)player.x-=player.speed;if(keys.ArrowRight||keys.d||keys.D||touchRight)player.x+=player.speed;player.x=Math.max(25,Math.min(W-25,player.x));if(keys[' ']||touchFire)shoot();if(player.cool>0)player.cool--;
let alive=invaders.filter(a=>a.alive);if(alive.length===0){won=true;gameOver=true}
let min=Infinity,max=-Infinity;alive.forEach(a=>{a.x+=dir*(0.55+score/1800);min=Math.min(min,a.x-a.w/2);max=Math.max(max,a.x+a.w/2)});
if(max>W-12||min<12){dir*=-1;alive.forEach(a=>{a.y+=15;if(a.y+a.h>player.y-18){gameOver=true;lives=0;updateHud()}})}
if(frame%50===0&&alive.length){let shooter=alive[Math.floor(Math.random()*alive.length)];enemyShots.push({x:shooter.x,y:shooter.y+20})}
shots.forEach(s=>s.y-=8);enemyShots.forEach(s=>s.y+=3.8);
shots.forEach(s=>{alive.forEach(a=>{if(Math.abs(s.x-a.x)<a.w*.48&&Math.abs(s.y-a.y)<a.h*.48){a.alive=false;s.dead=true;score+=10;updateHud()}})});
enemyShots.forEach(s=>{if(Math.abs(s.x-player.x)<24&&Math.abs(s.y-player.y)<25){s.dead=true;lives--;updateHud();player.x=W/2;if(lives<=0)gameOver=true}});
shots=shots.filter(s=>s.y>-10&&!s.dead);enemyShots=enemyShots.filter(s=>s.y<H+10&&!s.dead);
}
invaders.forEach(a=>{if(a.alive)drawSprite(catImgs[a.type],a.x-a.w/2,a.y-a.h/2,a.w,a.h)});
shots.forEach(s=>{ctx.fillStyle='#ff8ab8';ctx.fillRect(s.x-2,s.y-8,4,12);ctx.fillStyle='#fff0f6';ctx.fillRect(s.x-1,s.y-7,2,5)});
enemyShots.forEach(s=>{ctx.fillStyle='#bca0ff';ctx.fillRect(s.x-3,s.y-3,6,10)});
drawSprite(ratImgs[0],player.x-player.w/2,player.y-player.h/2,player.w,player.h);
if(paused){text('PAUSED',H/2,30)}
if(gameOver){ctx.fillStyle='#05040acc';ctx.fillRect(0,0,W,H);text(won?'TUNA SECURED!':'GAME OVER',H/2-12,32,won?'#ff91bf':'#ffc9df');text('SCORE: '+score,H/2+25,18);text('PRESS RESTART TO PLAY AGAIN',H/2+65,14,'#c5aaba')}
}
let touchLeft=false,touchRight=false,touchFire=false;
function hold(id,which){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(which==='left')touchLeft=true;if(which==='right')touchRight=true;if(which==='fire')touchFire=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{if(which==='left')touchLeft=false;if(which==='right')touchRight=false;if(which==='fire')touchFire=false}))}
hold('left','left');hold('right','right');hold('fire','fire');
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='p'&&!gameOver)paused=!paused});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('restart').onclick=reset;
reset();tick();
})();
</script></main></body></html>
